name: frameflow

# Local infrastructure for development and tests.
# Redis (BullMQ thumbnail jobs), Kafka (analytics events), and
# Prometheus/Grafana (observability). Production uses managed equivalents —
# never this file.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - frameflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-broker Kafka (KRaft, no ZooKeeper) for analytics events.
  # Dev-only convenience: auto-creates frameflow.analytics.v1 on first
  # publish. Production uses hosted Kafka (Confluent/Redpanda/Aiven) with an
  # explicitly created topic: 1+ partitions keyed by gallery, 7-day retention.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: "168"
    volumes:
      - frameflow-kafka:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  # Prometheus (Phase 9): scrapes the host-run API (:4000) and worker
  # metric servers (:9464 thumbnails, :9465 analytics) over
  # host.docker.internal. The backend and workers are NOT containerized in
  # dev, so run them with `bun run dev` as usual.
  # ADVERTISE note: METRICS_ENABLED defaults to on for NODE_ENV=development.
  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - frameflow-prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Grafana (Phase 9): provisioned with the Prometheus datasource and the
  # FrameFlow dashboard (infra/grafana). Host port 3030 — the frontend owns
  # 3000. Anonymous access is disabled; admin/admin is the dev default.
  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/frameflow.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - frameflow-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  frameflow-redis:
  frameflow-kafka:
  frameflow-prometheus:
  frameflow-grafana:
